[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "gateway"] 
# Add any other folders here that you intend to import as packages

[project]
name = "iiot-gateway"
version = "0.1.0"
description = "Industrial IoT Gateway"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",

    "sqlalchemy",
    "asyncpg",
    "alembic",

    "pydantic",
    "pydantic-settings",

    "python-jose[cryptography]",
    "passlib[bcrypt]",

    "loguru",

    "apscheduler",

    "pymodbus",

    "python-multipart"
]