# =====================================================
# Mosquitto MQTT Broker Config — IIoT Gateway Project
# =====================================================

# Cho phép kết nối không cần auth (CHỈ dùng cho dev/học tập!)
# Production thật cần bật password_file + ACL
allow_anonymous true

listener 1883
protocol mqtt

# WebSocket listener — để dashboard web (nếu có) subscribe trực tiếp
listener 9001
protocol websockets

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Persistence — giữ lại message khi container restart
persistence true
persistence_location /mosquitto/data/
